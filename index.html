<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

    </header>

    <main>
        <button id="openCounterCreationPortalBtn">Counter anlegen</button>
        <div id="createCounterPortal">
            <form action="post">
                <label for="counterName">Name:
                    <input id="counterName" type="text" placeholder="Bitte gebe den Namen deines Counters ein...">
                </label>
                
                <label for="startDate">Startdatum:
                    <input type="date" name="startDate" id="startDate" placeholder="Bitte gebe das Startdatum deines Counters ein...">
                </label>
                <label for="notes">Notizen
                    <textarea name="notes" id="notes"></textarea>
                </label>
                <button id="createCounterBtn">Counter anlegen</button>
            </form>
        </div>
    </main>

    <footer>

    </footer>
    <script src="script.js"></script>
</body>
</html>
